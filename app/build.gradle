import com.android.build.api.artifact.SingleArtifact

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application'
}

android {
    namespace = "com.romanpulov.odeon"
    compileSdk 37

    defaultConfig {
        applicationId "com.romanpulov.odeon"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.0.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

// The old applicationVariants API was removed in AGP 8+. The new Variant API cannot
// rename the produced APK in place (Studio deploys by the default name), so we copy
// the built release APK to a versioned name under build/outputs/renamed_apk/.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def capName = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def versionNameProvider = variant.outputs.first().versionName
        def apkDir = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def artifactsLoader = variant.artifacts.getBuiltArtifactsLoader()
        // Copy imperatively in doLast rather than via a Copy task: the destination is
        // AGP's own APK output directory, and declaring it as a task output would clash
        // with AGP's downstream tasks that read that directory.
        def copyRenamedApk = tasks.register("copyRenamedApk${capName}") {
            inputs.dir(apkDir)
            doLast {
                def srcFile = new File(artifactsLoader.load(apkDir.get()).elements.first().outputFile)
                def destFile = new File(srcFile.parentFile,
                        "odeon_${versionNameProvider.get().replace('.', '_')}.apk")
                Files.copy(srcFile.toPath(), destFile.toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("Created renamed APK: ${destFile}")
            }
        }
        // Run the copy automatically after the release APK is assembled.
        tasks.matching { it.name == "assemble${capName}".toString() }.configureEach {
            finalizedBy(copyRenamedApk)
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'

    // navigation
    implementation 'androidx.navigation:navigation-fragment:2.9.2'
    implementation 'androidx.navigation:navigation-ui:2.9.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // worker
    implementation 'androidx.work:work-runtime:2.10.2'

    // unrar
    implementation 'com.github.junrar:junrar:7.5.5'

    // ms access
    implementation 'com.healthmarketscience.jackcess:jackcess:4.0.6'

    // additional jars
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Room components
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'

    // tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}